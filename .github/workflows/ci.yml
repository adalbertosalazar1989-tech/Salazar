name: validar-saeng-v2

on:
  push:
    branches: [main, saeng-v2-final-candidate]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar dependencias
        run: python -m pip check

      - name: Compilar
        run: python -m compileall -q app.py v2_extensions.py build_icon.py tests

      - name: Testar
        run: python -m pytest -q

      - name: Validar PowerShell
        shell: pwsh
        run: |
          $scripts = @('.\INSTALAR_SAENG_V2.ps1', '.\AUDITAR_PASTAS_V2.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Verificar ausencia de certificados e chaves
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem . -Recurse -Force -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.pfx','.p12','.pem','.key') }
          if ($forbidden) {
            $forbidden | Select-Object FullName | Format-Table | Out-String | Write-Error
            exit 1
          }

      - name: Montar pacote do reconstrutor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact\SAENG_SST_V2_RECONSTRUTOR -Force | Out-Null
          $files = @(
            'INSTALAR_SAENG_V2.cmd',
            'INSTALAR_SAENG_V2.ps1',
            'AUDITAR_PASTAS_V2.ps1',
            'v2_extensions.py',
            'build_icon.py',
            'DOSSIE_COMPLETO_V2.md',
            'README.md',
            'requirements.txt',
            'VERSION'
          )
          foreach ($file in $files) { Copy-Item $file artifact\SAENG_SST_V2_RECONSTRUTOR\ -Force }
          Compress-Archive -Path artifact\SAENG_SST_V2_RECONSTRUTOR -DestinationPath artifact\SAENG_SST_V2_RECONSTRUTOR_SEM_SENHA.zip -CompressionLevel Optimal

      - name: Publicar pacote validado
        uses: actions/upload-artifact@v4
        with:
          name: SAENG_SST_V2_RECONSTRUTOR_SEM_SENHA
          path: artifact/SAENG_SST_V2_RECONSTRUTOR_SEM_SENHA.zip
          if-no-files-found: error
          retention-days: 30
