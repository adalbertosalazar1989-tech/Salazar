name: validar-atualizacao-operacional-v2

on:
  push:
    branches: [saeng-v2-final-operacional-v3]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar validador Python
        run: python -m pip install fastapi sqlalchemy openpyxl python-multipart
      - name: Compilar modulo operacional
        run: python -m py_compile operational_update/v2_operational.py
      - name: Validar rotas e regras criticas
        shell: pwsh
        run: |
          $text = Get-Content .\operational_update\v2_operational.py -Raw
          $required = @('/operacional/riscos','/operacional/importacao','/operacional/autorizacoes','/operacional/inconsistencias','/operacional/homologacao','09.01.001','QUANTITATIVO_INCOMPLETO','Gerar S-2240')
          foreach ($item in $required) { if (-not $text.Contains($item)) { throw "Conteudo obrigatorio ausente: $item" } }
      - name: Validar PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\operational_update\ATUALIZAR_SAENG_V2_OPERACIONAL.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
      - name: Bloquear certificados e chaves
        shell: pwsh
        run: |
          $blocked = @(Get-ChildItem .\operational_update -Recurse -File | Where-Object { $_.Extension -match '^\.(pfx|p12|pem|key)$' })
          if ($blocked.Count -gt 0) { throw "Arquivo secreto proibido encontrado" }
      - name: Montar pacote sem senha
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\SAENG_V2_ATUALIZACAO_OPERACIONAL -Force | Out-Null
          Copy-Item operational_update\* dist\SAENG_V2_ATUALIZACAO_OPERACIONAL -Recurse -Force
          Compress-Archive -Path dist\SAENG_V2_ATUALIZACAO_OPERACIONAL -DestinationPath dist\SAENG_V2_ATUALIZACAO_OPERACIONAL_SEM_SENHA.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: SAENG_V2_ATUALIZACAO_OPERACIONAL_SEM_SENHA
          path: dist/SAENG_V2_ATUALIZACAO_OPERACIONAL_SEM_SENHA.zip
